<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pain Point Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <h1>🔥 Pain Point Dashboard</h1>
  <div class="filters">
    <select id="f-platform">
      <option value="">Tất cả nguồn</option>
      <option value="reddit">Reddit</option>
      <option value="hn">Hacker News</option>
      <option value="so">StackOverflow</option>
      <option value="gh">GitHub</option>
    </select>
    <select id="f-days">
      <option value="7">7 ngày qua</option>
      <option value="30" selected>30 ngày qua</option>
      <option value="90">90 ngày qua</option>
      <option value="0">Tất cả</option>
    </select>
  </div>
</header>

<main>
  <section class="kpis" id="kpis"></section>

  <section class="grid-2">
    <div class="card"><h2>📈 Posts theo ngày</h2><canvas id="chartDaily"></canvas></div>
    <div class="card"><h2>🧭 Theo nguồn</h2><canvas id="chartSource"></canvas></div>
  </section>

  <section class="grid-2">
    <div class="card"><h2>⚡ Pain score trung bình theo nguồn</h2><canvas id="chartPain"></canvas></div>
    <div class="card"><h2>🕒 Các lần crawl (actions)</h2><canvas id="chartRuns"></canvas></div>
  </section>

  <section class="card">
    <h2>🏆 Top pain points</h2>
    <table id="topTable">
      <thead><tr><th>Pain</th><th>Nguồn</th><th>Cộng đồng</th><th>Tiêu đề</th><th>↑</th><th>💬</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="card">
    <h2>🗂️ Lần crawl gần nhất</h2>
    <table id="runsTable">
      <thead><tr><th>Thời gian</th><th>Nguồn</th><th>Số posts</th><th>Pain TB</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<footer>Dữ liệu từ Supabase · bot chạy trên GitHub Actions mỗi ngày</footer>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
